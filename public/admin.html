<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản trị trang cá nhân</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <a href="/index.html" class="back-link">&larr; Về trang chủ</a>

    <div id="login-box">
      <h1>Đăng nhập quản trị</h1>
      <p>Nhập mật khẩu quản trị để mở phần chỉnh sửa.</p>
      <form id="login-form">
        <label>Mật khẩu quản trị
          <input type="password" id="token-input" placeholder="Nhập mật khẩu" autocomplete="current-password" required />
        </label>
        <button id="login-btn" type="submit">Đăng nhập</button>
      </form>
      <p id="login-error" class="error"></p>
    </div>

    <div id="admin-box" class="hidden">
      <h1>Chỉnh sửa thông tin</h1>

      <form id="profile-form">
        <label>Họ tên
          <input type="text" name="name" required />
        </label>
        <label>Chức danh / mô tả ngắn
          <input type="text" name="title" />
        </label>
        <label>Giới thiệu
          <textarea name="bio" rows="4"></textarea>
        </label>
        <label>Ảnh đại diện
          <input type="url" name="avatarUrl" placeholder="Dán liên kết ảnh (https://...)" />
        </label>
        <label>Hoặc chọn ảnh từ máy
          <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp" />
        </label>
        <img id="avatar-preview" class="avatar-preview" alt="Xem trước ảnh đại diện" hidden />
        <label>Số điện thoại
          <input type="text" name="phone" />
        </label>
        <label>Email
          <input type="email" name="email" />
        </label>
        <label>Facebook
          <input type="url" name="facebook" />
        </label>
        <label>TikTok
          <input type="url" name="tiktok" />
        </label>
        <label>Instagram
          <input type="url" name="instagram" />
        </label>
        <button type="submit">Lưu thông tin</button>
        <p id="save-msg"></p>
      </form>

      <h2>Lịch học</h2>
      <table id="admin-schedule-table">
        <thead>
          <tr><th>Thứ</th><th>Bắt đầu</th><th>Kết thúc</th><th>Môn học</th><th>Phòng</th><th></th></tr>
        </thead>
        <tbody id="admin-schedule-body"></tbody>
      </table>

      <h3>Thêm buổi học mới</h3>
      <form id="add-schedule-form" class="inline-form">
        <select name="day" required>
          <option value="">Chọn thứ</option><option>Thứ 2</option><option>Thứ 3</option><option>Thứ 4</option><option>Thứ 5</option><option>Thứ 6</option><option>Thứ 7</option><option>Chủ nhật</option>
        </select>
        <input type="time" name="start" required />
        <input type="time" name="end" required />
        <input type="text" name="subject" placeholder="Môn học" required />
        <input type="text" name="room" placeholder="Phòng" />
        <button type="submit">Thêm</button>
      </form>

      <h2>Lời nhắn chờ duyệt</h2>
      <p id="pending-comments-empty">Đang tải…</p>
      <div id="pending-comments" class="pending-comments"></div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
